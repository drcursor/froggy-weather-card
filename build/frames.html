<!doctype html><meta charset="utf-8"><body style="margin:0;background:transparent">
<canvas id="c" width="1920" height="1920"></canvas>
<script src="../dist/canvaskit.js"></script><script src="../dist/Flare.min.js"></script>
<script>
// Steps one frog's Hero-Action at 30 fps for build/render_videos.py; window.frame(i) draws frame i.
window.info=null; const n=location.hash.slice(1), cv=document.getElementById('c'), g=new Flare.Graphics(cv);
g.initialize(()=>{new Flare.ActorLoader().load(`../dist/${n}_frog.flr`,a=>{
 a.initialize(g);const ab=a.makeInstance();ab.initialize(g);
 const an=ab._Animations.find(x=>x._Name==='Hero-Action')||ab._Animations[0];
 const ai=new Flare.AnimationInstance(an._Actor,an); ai.loop=false;
 const W=cv.width,w=ab.width,h=ab.height,x0=-ab.origin[0]*w,y0=-ab.origin[1]*h,s=Math.max(W/w,W/h);
 window.frame=(i)=>{ai.time=i/30;ai.apply(ab,1);ab.advance(i?1/30:0);
  g.clear([0,0,0,0]);g.setView([s,0,0,s,W/2-(x0+w/2)*s,W/2-(y0+h/2)*s]);ab.draw(g);g.flush();};
 window.info={duration:an._Duration,frames:Math.ceil(an._Duration*30)+1};});},'../dist/');
</script>
